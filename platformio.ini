[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = 
	dayatkun01/ClearDS1302@^1.0.1
	adafruit/Adafruit Unified Sensor@^1.1.15
	makuna/RTC@^2.5.0
	marcoschwartz/LiquidCrystal_I2C@^1.1.4
	forntoh/LcdMenu@^5.13.0
	madleech/Button@^1.2.0
	tzapu/WiFiManager@^2.0.17
